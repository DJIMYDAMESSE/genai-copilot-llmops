# Stack locale complète : API + LLM (Ollama, Qwen2.5) + Prometheus + Grafana
#   docker compose up -d --build
#   API : http://localhost:8080/docs   Grafana : http://localhost:3000 (admin/admin)
services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  # Télécharge le modèle une seule fois (persisté dans le volume)
  ollama-pull:
    image: ollama/ollama:0.12.6
    depends_on: { ollama: { condition: service_healthy } }
    environment: [OLLAMA_HOST=ollama:11434]
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b-instruct"]
    volumes: [ollama:/root/.ollama]
    restart: "no"

  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile }
    env_file: [.env.example]
    environment:
      LLM_PROVIDER: openai
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:1.5b-instruct
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment: [GF_SECURITY_ADMIN_PASSWORD=admin]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  ollama:
