apiVersion: v1
kind: ConfigMap
metadata:
  name: copilot-config
  namespace: genai-copilot
data:
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "http://vllm.genai-copilot.svc.cluster.local:8000/v1"
  LLM_MODEL: "Qwen/Qwen2.5-7B-Instruct"
  LLM_TIMEOUT_S: "60"
  LLM_MAX_RETRIES: "2"
  LLM_FALLBACK_LOCAL: "true"
  COPILOT_TOP_K: "4"
  COPILOT_MIN_RELEVANCE: "0.12"
