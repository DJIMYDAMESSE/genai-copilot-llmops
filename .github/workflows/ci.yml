name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests unitaires et d'intégration
        run: pytest -q
      - name: Évaluation RAG + quality gate
        run: PYTHONPATH=src python -m copilot.evaluate --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  build-and-push:
    needs: test-and-evaluate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/genai-copilot-llmops:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/genai-copilot-llmops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
